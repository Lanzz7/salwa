<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff0f5">
<title>♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:24px;
font-family:Georgia,"Times New Roman",serif;background:linear-gradient(145deg,#fff7fa,#ffe0ea,#fff0f5);color:#a8325b}
.card{position:relative;width:min(100%,440px);padding:42px 25px;text-align:center;
background:#ffffffc9;border:1px solid #fff;border-radius:30px;
box-shadow:0 20px 70px #c34d7224;backdrop-filter:blur(8px);animation:in .8s ease both}
.message{font-size:clamp(25px,7vw,36px);line-height:1.5;font-weight:bold}
.heart{position:fixed;bottom:-40px;color:#e7799b;opacity:.6;pointer-events:none;animation:float linear infinite}
@keyframes float{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
@keyframes in{from{opacity:0;transform:translateY(15px) scale(.97)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="hearts"></div>
<main class="card"><div class="message">Salwa buka blok e, aku bali bumen ra kerja mening </div></main>
<script>
const root=document.getElementById('hearts');
for(let i=0;i<24;i++){const h=document.createElement('span');h.className='heart';h.textContent=i%2?'♡':'';h.style.left=Math.random()*100+'%';h.style.fontSize=(15+Math.random()*22)+'px';h.style.animationDuration=(8+Math.random()*12)+'s';h.style.animationDelay=(-Math.random()*18)+'s';root.appendChild(h)}
</script>
</body>
</html>
